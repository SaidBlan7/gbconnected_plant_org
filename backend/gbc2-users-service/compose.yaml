services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gbc2
      POSTGRES_USER: gbc2
      POSTGRES_PASSWORD: gbc2_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbc2 -d gbc2"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./database/local/000_core_reference.sql:/docker-entrypoint-initdb.d/000.sql:ro
      - ./database/migrations/V1__user_plant_access.sql:/docker-entrypoint-initdb.d/001.sql:ro
