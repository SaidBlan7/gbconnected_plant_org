trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  MAVEN_OPTS: '-Xmx2048m'

steps:
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - task: Maven@4
    displayName: Verify all modules
    inputs:
      mavenPomFile: pom.xml
      goals: clean verify
      options: '-B'

  - task: CopyFiles@2
    displayName: Stage App Service JAR
    inputs:
      SourceFolder: runtime-app-service/target
      Contents: '*.jar'
      TargetFolder: '$(Build.ArtifactStagingDirectory)/app-service'

  - task: CopyFiles@2
    displayName: Stage Functions package
    inputs:
      SourceFolder: runtime-functions/target/azure-functions
      Contents: '**'
      TargetFolder: '$(Build.ArtifactStagingDirectory)/functions'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifact: gbc2-users-service
